<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NyaruVT Panel Wrapped</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #ff1493, #ff6ec7);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        @keyframes gradient {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
        }

        .highlight {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            backdrop-filter: blur(4px);
            font-size: 0.4rem;
        }
    </style>
</head>
<body>
<h1>NyaruVT Panel Wrapped</h1>
<h2>Verfügbar ab dem <strong>24. Dezember 2025</strong></h2>
<p class="highlight">
    Der jährliche <strong>NyaruVT Panel Wrapped</strong> ist ab dem <strong>24. Dezember 2025</strong> verfügbar
    und beinhaltet alle Daten vom <strong>01. Januar 2025</strong> bis zum <strong>01. Dezember 2025</strong>.
</p>
</body>
</html>
