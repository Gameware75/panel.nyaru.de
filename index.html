<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nyaruvt Panel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, hotpink, #ff69b4);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        button {
            background: linear-gradient(90deg, #ff0098, #6441A4);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
<button onclick="openpanel()">Panel öffnen</button>
</body>
<script>
    function openpanel() {
         window.open("https://www.twitch.tv/popout/nyaruvt/extensions/93r815knn52r4mnjt0f6j3rmfxohc7/panel", "_blank", "toolbar=yes,scrollbars=yes,resizable=no,top=500,left=500,width=300,height=530");
        window.close();
    }
</script>
</html>
